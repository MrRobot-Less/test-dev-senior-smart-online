services:
  automation:
    build: .
    env_file:
      - .env
    environment:
      APP_DATABASE_URL: postgresql+asyncpg://automation:automation@db:5432/automation
    volumes:
      - playwright-cache:/root/.cache/ms-playwright
    depends_on:
      db:
        condition: service_healthy
    command: uv run python -m smart_online_automation

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: automation
      POSTGRES_PASSWORD: automation
      POSTGRES_DB: automation
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automation -d automation"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  playwright-cache: